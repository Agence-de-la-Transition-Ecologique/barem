[project]
name = "barem"
version = "1.0.0"
description = "Visualize resources flows as Sankey Diagrams, in a browser window"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "dash==4.2.0",
    "dash-bootstrap-components==2.0.4",
    "dash-core-components==2.0.0",
    "dash-html-components==2.0.0",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "pyinstaller==6.21.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov"
]

